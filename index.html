<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Sara 💖</title>

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family: Arial;
  background: radial-gradient(circle at top,#1a0033,#000);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* floating background lights */
.bubbles span{
  position:absolute;
  width:10px;
  height:10px;
  background:#ff00cc;
  border-radius:50%;
  animation: rise 8s linear infinite;
  bottom:-50px;
}

@keyframes rise{
  to{
    transform:translateY(-110vh);
    opacity:0;
  }
}

.card{
  width:80%;
  max-width:700px;
  padding:30px;
  background:rgba(255,255,255,0.05);
  border-radius:20px;
  box-shadow:0 0 25px #00fff2;
  backdrop-filter:blur(10px);
  text-align:center;
}

h1{
  color:#00fff2;
  text-shadow:0 0 20px #00fff2;
}

#msg{
  margin-top:20px;
  font-size:18px;
  line-height:1.6;
  min-height:200px;
  text-align:left;
  white-space:pre-line;
  border-right:2px solid white;
  animation: blink 0.7s infinite;
}

@keyframes blink{
  50%{border-color:transparent;}
}

button{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:10px;
  background:#ff00cc;
  color:white;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 20px #ff00cc;
}
</style>
</head>

<body>

<div class="bubbles" id="bubbles"></div>

<div class="card">
  <h1>Happy Birthday Sara 🎉</h1>

  <button onclick="start()">Start Message 💌</button>

  <div id="msg"></div>
</div>

<!-- 🎵 BACKGROUND MUSIC -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/10/30/audio_12b6b1c3b1.mp3" type="audio/mp3">
</audio>

<script>
/* bubbles background */
for(let i=0;i<30;i++){
  let s=document.createElement("span");
  s.style.left=Math.random()*100+"vw";
  s.style.animationDuration=(3+Math.random()*5)+"s";
  s.style.background=["#ff00cc","#00fff2","#ffff00","#00ff88"][Math.floor(Math.random()*4)];
  document.getElementById("bubbles").appendChild(s);
}

/* message */
const text =
`Dear Sara ❤️

Today is a very special day…
the world got brighter when you came into it ✨

You deserve happiness, success and love in everything you do 💖

Happy Birthday Sara 🎂
Stay amazing forever 🌟`;

let i = 0;

function start(){
  /* 🎵 MUSIC START */
  let music = document.getElementById("music");
  music.volume = 0.6;
  music.play().catch(()=>{});

  typeWriter();
  confetti();
}

/* typing effect */
function typeWriter(){
  let el = document.getElementById("msg");

  let interval = setInterval(()=>{
    el.innerHTML += text[i] === "\n" ? "<br>" : text[i];
    i++;
    if(i >= text.length) clearInterval(interval);
  },40);
}

/* confetti */
function confetti(){
  for(let i=0;i<100;i++){
    let c=document.createElement("div");
    c.style.position="absolute";
    c.style.width="8px";
    c.style.height="8px";
    c.style.background=["#ff0","#0ff","#f0f","#0f0","#ff00cc"][Math.floor(Math.random()*5)];
    c.style.left=Math.random()*100+"vw";
    c.style.top="100vh";
    c.style.animation="fall 4s linear forwards";
    document.body.appendChild(c);

    setTimeout(()=>c.remove(),4000);
  }

  let style=document.createElement("style");
  style.innerHTML=`
  @keyframes fall{
    to{
      transform:translateY(-120vh) rotate(720deg);
      opacity:0;
    }
  }`;
  document.head.appendChild(style);
}
</script>

</body>
</html>
