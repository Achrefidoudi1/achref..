<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Fatma ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; font-family: 'Montserrat', sans-serif; overflow: hidden; }
        /* الصور في الخلفية الأساسية */
        .bg-slider { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-size: contain; background-repeat: no-repeat; background-position: center; 
            z-index: -1; transition: background 0.5s ease; 
        }
        /* كادر الرسالة المربع */
        .message-card { 
            position: relative; width: 90%; max-width: 500px; aspect-ratio: 1/1; 
            border-radius: 30px; overflow: hidden; border: 2px solid rgba(255,255,255,0.1);
        }
        /* الفيديو داخل الكادر مع Blur */
        .video-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; filter: blur(5px); z-index: 0;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen text-white">

    <div id="bgSlider" class="bg-slider"></div>

    <audio id="birthdayAudio" src="Happy Birthday (Piano Version).mp3"></audio>

    <div id="intro" class="text-center z-10">
        <button onclick="start()" class="bg-[#c5a059] px-10 py-4 rounded-full font-bold hover:opacity-90">Open Experience ✨</button>
        <h2 id="chrono" class="text-8xl font-bold mt-5 hidden">00:10</h2>
    </div>

    <!-- الكادر المربع -->
    <div id="card" class="message-card hidden shadow-2xl flex flex-col items-center justify-center p-6">
        <video id="bgVideo" class="video-bg" loop muted playsinline>
            <source src="VID_20260130_111317_199.mp4" type="video/mp4">
        </video>
        
        <div class="relative z-10 text-center bg-black/40 p-4 rounded-2xl">
            <h1 class="text-2xl text-[#c5a059] font-bold mb-2">Happy Birthday Fatma ❤️</h1>
            <p class="text-sm italic leading-tight">
                kol 3am w enti haya b khir ya fatma... ya3tik essaha 3la kol chay fi a9al min 3am waliti okhti eli ma jabet-hech omi... 
            </p>
        </div>
    </div>

    <script>
        const images = ['1783128405262.jpg', '1783128405309.jpg', '1783128405348.jpg'];
        let idx = 0;
        const bgSlider = document.getElementById('bgSlider');

        function start() {
            document.getElementById('intro').classList.add('hidden');
            document.getElementById('chrono').classList.remove('hidden');
            
            let imgInterval = setInterval(() => {
                bgSlider.style.backgroundImage = `url('${images[idx]}')`;
                idx = (idx + 1) % images.length;
            }, 3000);

            let time = 10;
            let chrono = document.getElementById('chrono');
            let timer = setInterval(() => {
                time--;
                chrono.innerText = `00:${time < 10 ? '0' + time : time}`;
                if (time <= 0) {
                    clearInterval(timer);
                    clearInterval(imgInterval);
                    document.getElementById('chrono').classList.add('hidden');
                    document.getElementById('card').classList.remove('hidden');
                    document.getElementById('birthdayAudio').play();
                    document.getElementById('bgVideo').play();
                }
            }, 1000);
        }
    </script>
</body>
</html>
